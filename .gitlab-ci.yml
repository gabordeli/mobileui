stages:
  - lint
  - test
  - quality
  - build
  - release
  - deploy

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RELEASE_TYPE: patch

.python_setup: &python_setup
  - python3 -m venv .ci-venv
  - .ci-venv/bin/pip install -q --upgrade pip
  - .ci-venv/bin/pip install -q pytest pytest-cov ruff build twisted wheel setuptools sentry-sdk

.python_job:
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .ci-venv/
      - webui/node_modules/

lint:
  stage: lint
  extends: .python_job
  before_script: *python_setup
  script:
    - .ci-venv/bin/ruff check .
    - cd webui
    - npm ci --silent
    - npm run typecheck

test:
  stage: test
  extends: .python_job
  before_script: *python_setup
  script:
    - .ci-venv/bin/pytest -q --cov=deluge_mobileui --cov-fail-under=80 --cov-report=xml:coverage.xml --cov-report=term
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    paths:
      - coverage.xml
    expire_in: 1 week

webui-test:
  stage: test
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - webui/node_modules/
  script:
    - cd webui
    - npm ci --silent
    - npm run test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    paths:
      - webui/coverage/lcov.info
    expire_in: 1 week

webui-e2e:
  stage: test
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - webui/node_modules/
  script:
    - cd webui
    - docker run --rm --ipc=host -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work mcr.microsoft.com/playwright:v1.65.1-jammy bash -lc "npm ci --silent && npx playwright test"
  artifacts:
    when: on_failure
    paths:
      - webui/test-results/
    expire_in: 1 week

sonar:
  stage: quality
  dependencies: [test, webui-test]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -n "$SONAR_TOKEN"
    - test -n "$SONAR_HOST_URL"
    - command -v docker >/dev/null
    - sed -i 's#<source>.*</source>#<source>deluge_mobileui</source>#' coverage.xml
    - VERSION=$(awk -F'"' '/^__version__ = "/{print $2}' deluge_mobileui/version.py)
    - mkdir -p "$HOME/.sonar"
    - docker run --rm --network host -u "$(id -u):$(id -g)" -e SONAR_USER_HOME=/tmp/sonar-cache -v "$HOME/.sonar:/tmp/sonar-cache" -v "$PWD:/usr/src" -w /usr/src sonarsource/sonar-scanner-cli:latest -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.projectVersion="$VERSION" -Dsonar.working.directory=/usr/src/.scannerwork

build:
  stage: build
  extends: .python_job
  before_script: *python_setup
  script:
    - cd webui
    - npm ci --silent
    - npm run build
    - cd ..
    - .ci-venv/bin/python -m build
    - SKIP_WEBUI=1 PYTHON=.ci-venv/bin/python ./scripts/package.sh
  artifacts:
    paths:
      - dist/
      - deluge_mobileui/data/
    expire_in: 1 week

release:
  stage: release
  extends: .python_job
  dependencies: [build]
  before_script: *python_setup
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - git config user.email "ci@example.invalid"
    - git config user.name "GitLab CI"
    - VERSION=$(./scripts/release.sh "$RELEASE_TYPE")
    - test -n "$VERSION"
    # A build artifact a bump előtti verziót tartalmazza; itt építjük újra.
    - (cd webui && npm ci --silent && npm run build)
    - EGG=$(SKIP_WEBUI=1 PYTHON=.ci-venv/bin/python ./scripts/package.sh)
    - test -n "$EGG"
    - git add deluge_mobileui/version.py webui/package.json webui/package-lock.json CHANGELOG.md deluge_mobileui/data
    - git commit -m "chore(release) v${VERSION}"
    - git tag -f "v${VERSION}"
    - git remote set-url origin "$CI_REPOSITORY_URL"
    - git push origin "HEAD:${CI_DEFAULT_BRANCH}" --tags
    - ./scripts/publish_release.sh "$VERSION" "$EGG"

deploy:
  stage: deploy
  extends: .python_job
  needs: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  before_script:
    - python3 -m venv .ci-venv
    - .ci-venv/bin/pip install -q --upgrade pip
    - .ci-venv/bin/pip install -q pytest ruff build twisted wheel setuptools
    - if [ -n "${DEPLOY_SSH_KEY:-}" ]; then install -d -m 700 ~/.ssh; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519; fi
  script:
    - test -n "${DEPLOY_HOST:-}" || { echo "DEPLOY_HOST CI variable is not set" >&2; exit 1; }
    - command -v rsync >/dev/null
    - rsync -az -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new" --exclude .git --exclude .venv --exclude .ci-venv --exclude .dev --exclude webui/node_modules --exclude .pytest_cache --exclude .ruff_cache ./ "$DEPLOY_HOST:/root/webui2/"
    - ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST" 'cd /root/webui2 && ./scripts/install.sh'
