[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MobileUi"
description = "Mobile-first web UI for Deluge, running as a core plugin inside deluged"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gabor Deli" }]
dependencies = ["Twisted>=22.4"]
dynamic = ["version"]

[project.entry-points."deluge.plugin.core"]
MobileUi = "deluge_mobileui:CorePlugin"

[tool.setuptools]
packages = ["deluge_mobileui"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "deluge_mobileui.version.__version__" }

[tool.setuptools.package-data]
deluge_mobileui = ["data/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".ci-venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
