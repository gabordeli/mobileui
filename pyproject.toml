[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MobileUi"
description = "Mobile-first web UI for Deluge, running as a core plugin inside deluged"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Gabor Deli", email = "gabor.deli@gmail.com" }]
maintainers = [{ name = "Gabor Deli", email = "gabor.deli@gmail.com" }]
keywords = ["deluge", "torrent", "webui", "mobile", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Twisted",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["Twisted>=22.4", "sentry-sdk>=2.0"]
dynamic = ["version"]

[project.optional-dependencies]
push = ["pywebpush==2.2.0", "py-vapid==1.9.0", "cryptography<45"]

[project.urls]
Homepage = "https://github.com/gabordeli/mobileui"
Source = "https://github.com/gabordeli/mobileui"
Issues = "https://github.com/gabordeli/mobileui/issues"

[project.entry-points."deluge.plugin.core"]
MobileUi = "deluge_mobileui:CorePlugin"

[tool.setuptools]
packages = [
    "deluge_mobileui",
    "deluge_mobileui.data",
    "deluge_mobileui.data.assets",
    "deluge_mobileui.data.icons",
]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "deluge_mobileui.version.__version__" }

[tool.setuptools.package-data]
deluge_mobileui = ["data/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".ci-venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
